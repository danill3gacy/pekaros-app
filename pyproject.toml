

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Храповик: правила ниже выключены, чтобы внедрение шло без большого рефакторинга.
# Убираем по одному — каждый раз это отдельный небольшой коммит.
ignore = ["B007", "B008", "B904", "B905", "SIM105", "SIM115", "UP031"]

[tool.ruff.lint.pycodestyle]
# Форматтер переносит код по 100; порог ошибки чуть выше — для строк и SQL,
# которые он разрывать не умеет и не должен.
max-line-length = 110

[tool.mypy]
python_version = "3.11"
files = ["coffeeos"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Следующая ступень: включить disallow_untyped_defs для остальных модулей
# (сейчас без аннотаций 276 функций — идём по модулю за раз).

[[tool.mypy.overrides]]
# Ядро уже полностью типизировано — держим планку здесь,
# остальные модули подтягиваем по одному.
module = ["coffeeos.config"]
disallow_untyped_defs = true
